<html lang="ru">
<head>
<meta charset="utf-8">

<title>Казначей — учёт финансов</title>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<style>
  :root{
    color-scheme: light;
    --paper:#F1ECDF;
    --surface:#FBF7EC;
    --surface-2:#F4EEE0;
    --ink:#221E17;
    --ink-2:#5B564A;
    --ink-muted:#8C8677;
    --line: rgba(34,30,23,0.13);
    --line-strong: rgba(34,30,23,0.22);
    --accent:#146E7D;
    --accent-strong:#0B4A56;
    --accent-soft: rgba(20,110,125,0.12);
    --accent-ink:#FBF8EF;
    --gold:#9C6E1E;
    --gold-soft: rgba(156,110,30,0.14);
    --good:#2E7D46;
    --good-soft: rgba(46,125,70,0.13);
    --warn:#B9700F;
    --warn-soft: rgba(185,112,15,0.15);
    --bad:#AA3B2C;
    --bad-soft: rgba(170,59,44,0.13);
    --group-home:#2a78d6;
    --group-personal:#eb6834;
    --group-other:#1baf7a;
    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 1px 2px rgba(34,30,23,0.06), 0 8px 24px -12px rgba(34,30,23,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#14181A;
      --surface:#1B2024;
      --surface-2:#20262A;
      --ink:#ECE7D9;
      --ink-2:#C7C1AF;
      --ink-muted:#8F8A7C;
      --line: rgba(236,231,217,0.14);
      --line-strong: rgba(236,231,217,0.24);
      --accent:#4FB9C7;
      --accent-strong:#7FD4DF;
      --accent-soft: rgba(79,185,199,0.16);
      --accent-ink:#0B2226;
      --gold:#D8AC5E;
      --gold-soft: rgba(216,172,94,0.16);
      --good:#63B378;
      --good-soft: rgba(99,179,120,0.16);
      --warn:#E3A24A;
      --warn-soft: rgba(227,162,74,0.16);
      --bad:#E0806B;
      --bad-soft: rgba(224,128,107,0.16);
      --group-home:#3987e5;
      --group-personal:#d95926;
      --group-other:#199e70;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#14181A;
    --surface:#1B2024;
    --surface-2:#20262A;
    --ink:#ECE7D9;
    --ink-2:#C7C1AF;
    --ink-muted:#8F8A7C;
    --line: rgba(236,231,217,0.14);
    --line-strong: rgba(236,231,217,0.24);
    --accent:#4FB9C7;
    --accent-strong:#7FD4DF;
    --accent-soft: rgba(79,185,199,0.16);
    --accent-ink:#0B2226;
    --gold:#D8AC5E;
    --gold-soft: rgba(216,172,94,0.16);
    --good:#63B378;
    --good-soft: rgba(99,179,120,0.16);
    --warn:#E3A24A;
    --warn-soft: rgba(227,162,74,0.16);
    --bad:#E0806B;
    --bad-soft: rgba(224,128,107,0.16);
    --group-home:#3987e5;
    --group-personal:#d95926;
    --group-other:#199e70;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Golos Text", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.num-display{ font-family:"Unbounded","Golos Text",sans-serif; font-weight:700; letter-spacing:-0.01em; text-wrap:balance; margin:0; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:14px; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  .app{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:236px; flex:0 0 236px;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:22px 20px 14px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:"Unbounded",sans-serif; font-weight:700; font-size:15px; flex:0 0 auto; }
  .brand-name{ font-family:"Unbounded",sans-serif; font-weight:700; font-size:16.5px; }
  .brand-sub{ font-size:11.5px; color:var(--ink-muted); margin-top:1px; }

  .month-switch{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin:6px 16px 12px; padding:9px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); }
  .month-switch button{ width:26px; height:26px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .month-switch button:hover{ background:var(--accent-soft); color:var(--accent); }
  .month-switch .month-label{ font-size:13px; font-weight:600; text-align:center; flex:1; }

  .nav{ list-style:none; margin:6px 0 0; padding:0 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{ display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border-radius:var(--radius-sm); border:none; background:transparent; color:var(--ink-2); cursor:pointer; text-align:left; font-size:14px; font-weight:500; }
  .nav-item svg{ flex:0 0 auto; opacity:0.85; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  :root:not([data-theme="light"]) .nav-item.active{ color:var(--accent); }
  .nav-item.active svg{ opacity:1; }

  .sidebar-foot{ padding:14px 20px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-muted); display:flex; align-items:center; gap:7px; background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left; font-family:inherit; cursor:pointer; }
  .sidebar-foot:hover{ color:var(--ink-2); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:0 0 auto; }
  .sync-dot.local{ background:var(--warn); }
  .sync-dot.saving{ background:var(--ink-muted); }

  /* Main */
  .main{ flex:1; min-width:0; padding:30px 34px 70px; }
  .view-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .view-title{ font-size:24px; }
  .view-desc{ color:var(--ink-2); font-size:13.5px; margin-top:4px; max-width:52ch; }
  .actions-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:var(--ink-muted); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-2); padding:9px 10px; }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:999px; }
  .btn-danger-arm{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
  .card + .card{ margin-top:16px; }
  .card-title{ font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .card-title small{ font-weight:500; color:var(--ink-muted); font-size:12px; }

  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
  .grid-kpi{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .kpi-label{ font-size:12px; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .kpi-value{ font-family:"Unbounded",sans-serif; font-weight:700; font-size:21px; margin-top:8px; letter-spacing:-0.01em; }
  .kpi-value.good{ color:var(--good); }
  .kpi-value.bad{ color:var(--bad); }
  .kpi-sub{ font-size:12px; color:var(--ink-muted); margin-top:4px; }

  @media (max-width:1080px){ .grid-2{ grid-template-columns:1fr; } .grid-kpi{ grid-template-columns:repeat(2,1fr); } }

  .bar-row{ padding:9px 0; border-bottom:1px solid var(--line); }
  .bar-row:last-child{ border-bottom:none; }
  .bar-row-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:6px; }
  .bar-label{ display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); min-width:0; }
  .bar-label span.name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .bar-value{ font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap; font-size:12.5px; }
  .bar-track{ height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; min-width:3px; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-bottom:12px; }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; }

  .meter{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; position:relative; }
  .meter-fill{ height:100%; border-radius:5px; }

  .empty{ text-align:center; padding:36px 18px; color:var(--ink-2); }
  .empty h3{ font-size:15px; margin-bottom:6px; }
  .empty p{ font-size:13px; color:var(--ink-muted); max-width:40ch; margin:0 auto 14px; }

  .tip-card{ border:1px dashed var(--line-strong); background:transparent; }
  .tip-list{ display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .tip-chip{ font-size:12px; padding:5px 10px; border-radius:999px; background:var(--gold-soft); color:var(--gold); font-weight:600; }

  /* Tables / lists */
  .tx-filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .tx-filters select, .tx-filters input[type="search"]{ padding:8px 11px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px; }
  .tx-list{ display:flex; flex-direction:column; }
  .tx-row{ display:grid; grid-template-columns:86px 1fr auto auto; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-date{ font-size:12px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .tx-mid{ min-width:0; }
  .tx-cat{ font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .tx-note{ font-size:12px; color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-amount{ font-variant-numeric:tabular-nums; font-weight:700; font-size:13.5px; white-space:nowrap; }
  .tx-amount.income{ color:var(--good); }
  .tx-amount.expense{ color:var(--ink); }
  .tx-row-actions{ display:flex; gap:6px; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--ink-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

  .group-block + .group-block{ margin-top:18px; }
  .group-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .group-swatch{ width:9px; height:9px; border-radius:3px; }
  .budget-row{ display:grid; grid-template-columns:1.1fr 130px auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .budget-row:last-child{ border-bottom:none; }
  .budget-name{ font-size:13.5px; font-weight:600; }
  .budget-meter-wrap{ display:flex; flex-direction:column; gap:5px; }
  .budget-meta{ font-size:11.5px; color:var(--ink-muted); display:flex; justify-content:space-between; gap:8px; }
  .budget-input-wrap{ display:flex; align-items:center; gap:6px; justify-self:end; }
  .budget-input{ width:118px; padding:7px 9px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }

  .entity-list{ display:flex; flex-direction:column; gap:10px; }
  .entity-card{ border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; background:var(--surface-2); }
  .entity-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .entity-name{ font-weight:700; font-size:14px; }
  .entity-type{ font-size:11.5px; color:var(--ink-muted); margin-top:1px; }
  .entity-figures{ display:flex; gap:18px; margin-top:10px; flex-wrap:wrap; }
  .figure{ font-size:12px; color:var(--ink-muted); }
  .figure b{ display:block; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; font-weight:700; margin-top:2px; }
  .figure b.good{ color:var(--good); }
  .figure b.bad{ color:var(--bad); }
  .entity-bars{ display:flex; flex-direction:column; gap:4px; margin-top:10px; }
  .mini-bar-track{ height:6px; border-radius:4px; background:var(--surface); }
  .mini-bar-fill{ height:100%; border-radius:4px; }
  .entity-actions{ display:flex; gap:6px; }

  /* Modal */
  #modal-root{ position:fixed; inset:0; display:none; z-index:50; }
  #modal-root.open{ display:block; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,17,12,0.45); backdrop-filter:blur(1px); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; overflow-y:auto; }
  :root:not([data-theme="light"]) .modal-backdrop{ background:rgba(0,0,0,0.6); }
  .modal{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:440px; padding:22px 22px 20px; }
  .modal h3{ font-size:17px; margin-bottom:4px; }
  .modal-desc{ font-size:12.5px; color:var(--ink-muted); margin-bottom:16px; }
  .field{ margin-bottom:13px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
  .field input, .field select, .field textarea{ padding:9px 11px; border-radius:9px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); }
  .field textarea{ resize:vertical; min-height:52px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }
  .type-toggle{ display:flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden; }
  .type-toggle button{ flex:1; padding:8px 0; border:none; background:transparent; color:var(--ink-2); font-weight:600; font-size:13px; cursor:pointer; }
  .type-toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .field-error{ font-size:11.5px; color:var(--bad); min-height:14px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  /* Trend chart */
  .trend-wrap{ overflow-x:auto; }
  .trend-svg{ display:block; }
  .trend-bar{ cursor:pointer; }
  .trend-bar:hover{ opacity:0.82; }

  .chart-tooltip{ position:fixed; pointer-events:none; background:var(--ink); color:var(--paper); font-size:12px; padding:6px 9px; border-radius:8px; transform:translate(-50%,-115%); opacity:0; transition:opacity .1s; z-index:80; white-space:nowrap; box-shadow:var(--shadow); }
  :root:not([data-theme="light"]) .chart-tooltip{ background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink); }
  .chart-tooltip.visible{ opacity:1; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:90; }
  .toast.visible{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Mobile */
  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:sticky; top:0; z-index:20; }
    .brand{ padding:14px 16px 8px; }
    .month-switch{ margin:4px 16px 10px; }
    .nav{ flex-direction:row; overflow-x:auto; padding:2px 12px 10px; gap:6px; -webkit-overflow-scrolling:touch; }
    .nav-item{ flex:0 0 auto; padding:8px 12px; white-space:nowrap; }
    .nav-item span.label{ font-size:12.5px; }
    .sidebar-foot{ justify-content:center; padding:8px 16px 12px; }
    .main{ padding:18px 16px 60px; }
    .view-title{ font-size:20px; }
    .grid-kpi{ grid-template-columns:repeat(2,1fr); }
    .tx-row{ grid-template-columns:1fr auto; grid-template-areas:"date actions" "mid mid" "amount amount"; row-gap:4px; }
    .budget-row{ grid-template-columns:1fr; }
    .budget-input-wrap{ justify-self:start; }
  }
</style>
</head>

  /* ---------- trend chart (SVG, built via JS for hover) ---------- */
  function mountChartsForView(){
    var host = document.getElementById("chart-trend");
    if(!host) return;
    var months = [];
    for(var i=5;i>=0;i--) months.push(shiftMonth(state.selectedMonth, -i));
    var data = months.map(function(m){
      var tx = txForMonth(m);
      return { m:m, income: sumByType(tx,"income"), expense: sumByType(tx,"expense") };
    });
    var max = Math.max.apply(null, data.reduce(function(a,d){ return a.concat([d.income,d.expense]); }, [1]));
    var w = 560, h = 190, padL = 8, padR = 8, padT = 10, padB = 26;
    var groupW = (w - padL - padR) / months.length;
    var barW = Math.min(20, groupW*0.3);
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", "100%");
    svg.setAttribute("class", "trend-svg");
    svg.style.minWidth = "480px";

    // gridlines
    [0.25,0.5,0.75,1].forEach(function(f){
      var y = padT + (h-padT-padB) * (1-f);
      var line = document.createElementNS(svgNS,"line");
      line.setAttribute("x1", padL); line.setAttribute("x2", w-padR);
      line.setAttribute("y1", y); line.setAttribute("y2", y);
      line.setAttribute("stroke", "var(--line)"); line.setAttribute("stroke-width","1");
      svg.appendChild(line);
    });

    var colorIncome = "var(--good)", colorExpense = "var(--gold)";

    data.forEach(function(d, idx){
      var gx = padL + idx*groupW;
      var cx = gx + groupW/2;
      [ {key:"income", val:d.income, color:colorIncome, dx:-barW*0.6},
        {key:"expense", val:d.expense, color:colorExpense, dx:barW*0.6} ].forEach(function(s){
        var bh = max>0 ? (s.val/max) * (h-padT-padB) : 0;
        var rect = document.createElementNS(svgNS,"rect");
        rect.setAttribute("x", cx + s.dx - barW/2);
        rect.setAttribute("y", h-padB-bh);
        rect.setAttribute("width", barW);
        rect.setAttribute("height", Math.max(1,bh));
        rect.setAttribute("rx", 3);
        rect.setAttribute("fill", s.color);
        rect.setAttribute("class","trend-bar");
        rect.addEventListener("mouseenter", function(ev){
          var r = ev.target.getBoundingClientRect();
          showTip(r.left + r.width/2, r.top, (s.key==="income"?"Доход":"Расход") + " · " + monthLabel(d.m) + "<br>" + formatMoney(s.val));
        });
        rect.addEventListener("mousemove", function(ev){
          var r = ev.target.getBoundingClientRect();
          showTip(r.left + r.width/2, r.top, (s.key==="income"?"Доход":"Расход") + " · " + monthLabel(d.m) + "<br>" + formatMoney(s.val));
        });
        rect.addEventListener("mouseleave", hideTip);
        svg.appendChild(rect);
      });
      var label = document.createElementNS(svgNS,"text");
      label.setAttribute("x", cx); label.setAttribute("y", h-8);
      label.setAttribute("text-anchor","middle");
      label.setAttribute("font-size","9.5");
      label.setAttribute("fill","var(--ink-muted)");
      label.textContent = MONTH_NAMES[Number(d.m.split("-")[1])-1].slice(0,3);
      svg.appendChild(label);
    });

    host.innerHTML = "";
    host.appendChild(svg);
    var legend = document.createElement("div");
    legend.className = "legend";
    legend.style.marginTop = "8px";
    legend.innerHTML =
      '<span class="legend-item"><span class="legend-swatch" style="background:var(--good)"></span>Доходы</span>' +
      '<span class="legend-item"><span class="legend-swatch" style="background:var(--gold)"></span>Расходы</span>';
    host.appendChild(legend);
  }

  /* ---------- TRANSACTIONS ---------- */

      if(ui.txCategory!=="all" && t.categoryId!==ui.txCategory) return false;
      if(ui.txSearch){
        var hay = ((t.note||"") + " " + (findCategory(t.type,t.categoryId)||{}).name).toLowerCase();
        if(hay.indexOf(ui.txSearch.toLowerCase())===-1) return false;
      }
      return true;
    });

    var allCats = state.categories.expense.concat(state.categories.income);
    var catOptions = '<option value="all">Все категории</option>' + allCats.map(function(c){
      return '<option value="'+c.id+'"'+(ui.txCategory===c.id?" selected":"")+'>'+escapeHtml(c.name)+'</option>';
    }).join("");

    var filters =
      '<div class="tx-filters">' +
        '<select data-role="filter-scope"><option value="month"'+(ui.txScope==="month"?" selected":"")+'>' + monthLabel(state.selectedMonth) + '</option><option value="all"'+(ui.txScope==="all"?" selected":"")+'>За всё время</option></select>' +
        '<select data-role="filter-type"><option value="all"'+(ui.txType==="all"?" selected":"")+'>Все типы</option><option value="income"'+(ui.txType==="income"?" selected":"")+'>Доходы</option><option value="expense"'+(ui.txType==="expense"?" selected":"")+'>Расходы</option></select>' +
        '<select data-role="filter-category">' + catOptions + '</select>' +

      '</div>';

    var body;

      body = '<div class="empty"><h3>Операций не найдено</h3><p>Измените фильтры или добавьте новую операцию.</p></div>';
    } else {
      body = '<div class="tx-list">' + list.map(txRow).join("") + '</div>';
    }

    var backupCard =
      '<div class="card">' +
        '<div class="card-title">Резервная копия <small>сохраняет все данные: операции, бюджет, инвестиции, долги, цели</small></div>' +
        '<div class="actions-row">' +
          '<button class="btn btn-primary" data-action="export-backup">Скачать копию данных</button>' +
          '<button class="btn" data-action="import-backup">Загрузить копию данных</button>' +
          '<button class="btn btn-ghost" data-action="export-csv">Открыть в Excel (CSV, только операции)</button>' +
        '</div>' +
        '<input type="file" id="backup-file-input" accept=".json" style="display:none">' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Импорт из таблицы <small>подтянуть данные из CSV-файла, выгруженного из Google Таблиц или Excel</small></div>' +
        '<div class="actions-row">' +
          '<button class="btn btn-primary" data-action="import-sheet">Выбрать CSV-файл</button>' +
        '</div>' +
        '<input type="file" id="sheet-file-input" accept=".csv,text/csv" style="display:none">' +
        '<p style="font-size:12.5px;color:var(--ink-muted);margin:10px 0 0">Заменит текущие данные в приложении на то, что записано в файле. В Google Таблицах: Файл → Скачать → «Значения, разделённые запятой (.csv)».</p>' +
      '</div>';

    return (
      viewHeader("Операции", "Все доходы и расходы с возможностью фильтрации", [ addTxButton() ]) +
      backupCard +
      '<div class="card"><div class="card-title">Список операций <small>' + list.length + '</small></div>' + filters + body + '</div>'
    );

  function txRow(t){
    var cat = findCategory(t.type, t.categoryId);
    var color = t.type==="income" ? "var(--good)" : (cat ? "var(--group-"+cat.group+")" : "var(--ink-muted)");
    return (
      '<div class="tx-row">' +
        '<div class="tx-date">' + formatDateShort(t.date) + '</div>' +
        '<div class="tx-mid"><div class="tx-cat"><span class="bar-dot" style="background:'+color+'"></span>' + escapeHtml(cat?cat.name:"—") + '</div>' +

  function formatDateShort(d){
    var p = d.split("-");

  }

  /* ---------- BUDGET ---------- */
  function viewBudget(){
    var ym = state.selectedMonth;
    var spend = categorySpend(ym);
    var grouped = categoriesGrouped("expense");
    var totalBudget = 0, totalSpent = 0;
    (state.categories.expense||[]).forEach(function(c){ if(c.budget){ totalBudget+=c.budget; totalSpent += (spend[c.id]||0); } });

    var summary = totalBudget>0 ? (
      '<div class="card">' +
        '<div class="card-title">Итого по месяцу <small>' + monthLabel(ym) + '</small></div>' +
        budgetMeterRow({name:"Все категории с лимитом", budget:totalBudget}, totalSpent) +
      '</div>'
    ) : "";

    var groups = GROUP_ORDER.map(function(g){
      var cats = grouped[g];
      if(cats.length===0) return "";
      var rows = cats.map(function(c){
        var spent = spend[c.id]||0;
        var pct = c.budget ? clamp(spent/c.budget*100,0,999) : 0;
        var color = !c.budget ? "var(--ink-muted)" : pct>100 ? "var(--bad)" : pct>=85 ? "var(--warn)" : "var(--good)";
        var meta = c.budget ? (formatMoney(spent) + " из " + formatMoney(c.budget) + (pct>100 ? " · превышение " + formatMoney(spent-c.budget) : "")) : (spent>0 ? "Потрачено " + formatMoney(spent) + " · лимит не задан" : "Лимит не задан");
        return (
          '<div class="budget-row">' +
            '<div><div class="budget-name">'+escapeHtml(c.name)+'</div>' +
              '<div class="budget-meter-wrap" style="margin-top:6px"><div class="meter" title="'+meta+'"><div class="meter-fill" style="width:'+clamp(pct,2,100)+'%;background:'+color+'"></div></div>' +
              '<div class="budget-meta"><span>'+meta+'</span></div></div></div>' +
            '<div></div>' +
            '<div class="budget-input-wrap"><input class="budget-input" type="text" inputmode="decimal" placeholder="0" value="'+(c.budget||"")+'" data-role="budget-input" data-id="'+c.id+'">' +
              (c.builtin ? '' : '<button class="icon-btn" data-action="delete-category" data-type="expense" data-id="'+c.id+'" aria-label="Удалить">'+ICONS.trash+'</button>') +
            '</div>' +
          '</div>'
        );
      }).join("");
      return '<div class="group-block"><div class="group-title"><span class="group-swatch" style="background:var(--group-'+g+')"></span>' + GROUP_LABELS[g] + '</div>' + rows + '</div>';
    }).join("");

    return (
      viewHeader("Бюджет", "Задайте месячный лимит по каждой категории — необязательные можно оставить пустыми.", [
        '<button class="btn" data-action="add-category" data-type="expense">' + ICONS.plus + ' Своя категория</button>'
      ]) +
      summary +
      '<div class="card"><div class="card-title">Категории и лимиты</div>' + groups + '</div>' +
      '<div style="margin-top:12px;font-size:12.5px;color:var(--ink-muted)">Мы заранее добавили частые категории — продукты, подписки, мобильную связь, аптеку и другие. Лишние можно удалить, если завели свою категорию взамен.</div>'
    );
  }

  /* ---------- INVESTMENTS ---------- */
  function viewInvestments(){
    var t = totalInvestments();
    var gain = t.current - t.invested;
    var gainPct = t.invested>0 ? Math.round(gain/t.invested*100) : null;
    var summary =
      '<div class="grid-kpi">' +
        kpiCard("Вложено всего", formatMoney(t.invested), "") +
        kpiCard("Текущая стоимость", formatMoney(t.current), "") +
        kpiCard("Доход / убыток", formatMoney(gain), gain>=0?"good":"bad") +
        kpiCard("Доходность", gainPct===null?"—":(gainPct+"%"), gainPct===null?"":(gainPct>=0?"good":"bad")) +
      '</div>';

    var body;
    if(state.investments.length===0){
      body = '<div class="empty"><h3>Нет активов</h3><p>Добавьте вклад, акции, депозит, недвижимость или другой актив, чтобы видеть общую картину.</p><button class="btn btn-primary" data-action="add-inv">' + ICONS.plus + ' Добавить актив</button></div>';
    } else {
      var maxVal = Math.max.apply(null, state.investments.reduce(function(a,i){ return a.concat([Number(i.invested||0), Number(i.current||0)]); }, [1]));
      body = '<div class="entity-list">' + state.investments.slice().sort(function(a,b){ return Number(b.current)-Number(a.current); }).map(function(inv){
        var g = Number(inv.current) - Number(inv.invested);
        var gp = Number(inv.invested)>0 ? Math.round(g/Number(inv.invested)*100) : null;
        return (
          '<div class="entity-card">' +
            '<div class="entity-top"><div><div class="entity-name">'+escapeHtml(inv.name)+'</div><div class="entity-type">'+escapeHtml(inv.assetType||"Актив")+' · с '+formatDateShort(inv.date||todayStr())+'</div></div>' +
              '<div class="entity-actions"><button class="icon-btn" data-action="edit-inv" data-id="'+inv.id+'">'+ICONS.edit+'</button><button class="icon-btn" data-action="delete-inv" data-id="'+inv.id+'">'+ICONS.trash+'</button></div></div>' +
            '<div class="entity-figures">' +
              figure("Вложено", Number(inv.invested)) +
              figure("Сейчас стоит", Number(inv.current)) +

              '<div class="mini-bar-track" title="Вложено"><div class="mini-bar-fill" style="width:'+clamp(Number(inv.invested)/maxVal*100,2,100)+'%;background:var(--ink-muted)"></div></div>' +

            '</div>' +
            (inv.note ? '<div class="tx-note" style="margin-top:8px">'+escapeHtml(inv.note)+'</div>' : '') +
          '</div>'
        );
      }).join("") + '</div>';

    return (
      viewHeader("Инвестиции", "Отслеживайте вложения и их текущую стоимость", [ state.investments.length ? '<button class="btn btn-primary" data-action="add-inv">'+ICONS.plus+' Добавить актив</button>' : '' ]) +

      '<div class="card"><div class="card-title">Ваши активы <small>' + state.investments.length + '</small></div>' + body + '</div>'
    );
  }

  /* ---------- DEBTS & GOALS ---------- */
  function viewDebts(){
    var debtTotal = totalDebtRemaining();
    var debtsBody;
    if(state.debts.length===0){
      debtsBody = '<div class="empty"><h3>Долгов не добавлено</h3><p>Кредиты и рассрочки стоит учитывать — иначе картина финансов будет неполной.</p><button class="btn btn-primary" data-action="add-debt">'+ICONS.plus+' Добавить долг</button></div>';
    } else {
      debtsBody = '<div class="entity-list">' + state.debts.slice().sort(function(a,b){ return Number(b.remaining)-Number(a.remaining); }).map(function(d){
        var paidPct = Number(d.total)>0 ? clamp((Number(d.total)-Number(d.remaining))/Number(d.total)*100,0,100) : 0;
        return (
          '<div class="entity-card">' +
            '<div class="entity-top"><div><div class="entity-name">'+escapeHtml(d.name)+'</div><div class="entity-type">Ежемесячный платёж: '+formatMoney(d.monthlyPayment||0)+'</div></div>' +
              '<div class="entity-actions"><button class="icon-btn" data-action="edit-debt" data-id="'+d.id+'">'+ICONS.edit+'</button><button class="icon-btn" data-action="delete-debt" data-id="'+d.id+'">'+ICONS.trash+'</button></div></div>' +
            '<div class="entity-figures">' + figure("Всего", Number(d.total)) + figure("Осталось выплатить", Number(d.remaining)) + figurePct("Выплачено", Math.round(paidPct)+"%", false) + '</div>' +
            '<div class="meter" style="margin-top:8px" title="Погашено '+Math.round(paidPct)+'%"><div class="meter-fill" style="width:'+clamp(paidPct,2,100)+'%;background:var(--good)"></div></div>' +
            (d.note ? '<div class="tx-note" style="margin-top:8px">'+escapeHtml(d.note)+'</div>' : '') +
          '</div>'
        );
      }).join("") + '</div>';
    }

    var goalsBody;
    if(state.goals.length===0){
      goalsBody =
        '<div class="empty"><h3>Целей пока нет</h3><p>Например, «подушка безопасности» на 3–6 месяцев расходов — база финансовой устойчивости.</p>' +
        '<button class="btn btn-primary" data-action="add-goal-preset">'+ICONS.plus+' Добавить «Подушка безопасности»</button></div>';
    } else {
      goalsBody = '<div class="entity-list">' + state.goals.slice().sort(function(a,b){
        if(a.deadline && b.deadline) return a.deadline<b.deadline?-1:a.deadline>b.deadline?1:0;
        return a.deadline ? -1 : b.deadline ? 1 : 0;
      }).map(function(g){
        var target = Number(g.target), current = Number(g.current);
        var pct = target>0 ? clamp(current/target*100,0,100) : 0;
        var remaining = Math.max(0, target-current);
        var planLine = "";
        if(remaining<=0 && target>0){
          planLine = '<div class="tx-note" style="margin-top:8px;color:var(--good)">Цель уже достигнута</div>';
        } else if(g.deadline){
          var mLeft = monthsBetween(currentMonthStr(), g.deadline);
          if(mLeft<=0){
            planLine = '<div class="tx-note" style="margin-top:8px;color:var(--bad)">Срок уже прошёл, а не хватает ещё '+formatMoney(remaining)+'</div>';
          } else {
            var perMonth = Math.ceil(remaining/mLeft);
            planLine = '<div class="tx-note" style="margin-top:8px">Нужно копить по '+formatMoney(perMonth)+'/мес — осталось '+mLeft+' '+pluralMonths(mLeft)+'</div>';
          }
        }
        return (
          '<div class="entity-card">' +
            '<div class="entity-top"><div><div class="entity-name">'+escapeHtml(g.name)+'</div>'+(g.deadline?'<div class="entity-type">Срок: '+monthLabel(g.deadline)+'</div>':'')+'</div>' +
              '<div class="entity-actions"><button class="icon-btn" data-action="edit-goal" data-id="'+g.id+'">'+ICONS.edit+'</button><button class="icon-btn" data-action="delete-goal" data-id="'+g.id+'">'+ICONS.trash+'</button></div></div>' +
            '<div class="entity-figures">' + figure("Накоплено", current) + figure("Цель", target) + figurePct("Прогресс", Math.round(pct)+"%", false) + '</div>' +

  /* ---------- CRUD ---------- */
  // Money fields are plain text inputs (inputmode="decimal"), not
  // type="number" — phones with a Russian/Uzbek keyboard layout put a
  // comma on the numeric keypad, and a native <input type="number"> treats
  // that as an invalid value and silently blocks form submission (no error
  // shown — the tap on "Сохранить" just does nothing). Parsing in JS avoids
  // that entirely and accepts spaces as thousands separators and a comma
  // as a decimal point, matching the Google Sheets importer's sheetNum().
  function parseAmount(v){
    if(v===undefined || v===null || v==="") return NaN;
    var s = String(v).trim().replace(/\s/g,"").replace(",", ".");
    var n = parseFloat(s);
    return n;
  }
  function saveTransaction(form){
    var data = new FormData(form);
    var id = form.dataset.id;
    var amount = parseAmount(data.get("amount"));
    if(!amount || isNaN(amount) || amount<=0){ showFormError(form, "Укажите сумму больше нуля"); return; }
    var payload = { type:data.get("type"), categoryId:data.get("categoryId"), amount:amount, date:data.get("date")||todayStr(), note:(data.get("note")||"").trim() };
    if(id){
      var idx = state.transactions.findIndex(function(t){ return t.id===id; });
      if(idx>-1) state.transactions[idx] = Object.assign({}, state.transactions[idx], payload);
    } else {
      state.transactions.push(Object.assign({ id:uid() }, payload));
    }
    persist(); closeModal(); render(); showToast("Сохранено");
  }
  function deleteTransaction(id){ state.transactions = state.transactions.filter(function(t){ return t.id!==id; }); persist(); render(); showToast("Операция удалена"); }

  /* ---------- import from the standalone "Казначей" Google Sheet ----------
     Read-only pull: parses the sheet's current CSV export (via the mcp
     capability's Google Drive connector) into the app's normal state shape,
     then reuses the same confirm-and-replace flow as a backup-file import.
     The app never writes back to the sheet — the sheet stays the thing the
     user edits directly in Google Drive; this only visualizes it. Column
     positions are found by matching header text rather than hardcoded
     indices, so adding/removing rows in the sheet doesn't break the import
     (adding/removing whole columns inside a block still would). */
  function parseCsvGrid(text){
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i=0;i<text.length;i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\r'){ /* ignore, \n (if present) ends the row below */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }
  function findCellRC(rows, text){
    for (var r=0;r<rows.length;r++){
      for (var c=0;c<rows[r].length;c++){
        if((rows[r][c]||"").trim()===text) return { r:r, c:c };
      }
    }
    return null;
  }
  function cellAt(rows, r, c){ return (rows[r] && rows[r][c]!==undefined) ? rows[r][c] : ""; }
  function sheetNum(v){
    if(v===undefined || v===null || v==="") return 0;
    var n = parseFloat(String(v).replace(/\s/g,"").replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function sheetRowsToState(rows){
    var out = { version:2, categories:cloneDefaultCategories(), transactions:[], investments:[], debts:[], goals:[], selectedMonth: state.selectedMonth||currentMonthStr(), updatedAt:0 };
    function catIdByName(name, type){
      name = (name||"").trim();
      if(!name) return null;
      var list = out.categories[type];
      for (var i=0;i<list.length;i++){ if(list[i].name===name) return list[i].id; }
      var id = slugify(name);
      if(type==="expense") list.push({ id:id, name:name, group:"other", budget:null, builtin:false });
      else list.push({ id:id, name:name, builtin:false });
      return id;
    }

    var dateAnchor = findCellRC(rows, "Дата");
    if(dateAnchor){
      var oc = dateAnchor.c;
      for (var r=dateAnchor.r+1; r<rows.length; r++){
        var date = cellAt(rows,r,oc), typeRu = cellAt(rows,r,oc+1), catName = cellAt(rows,r,oc+3),
            amount = cellAt(rows,r,oc+4), note = cellAt(rows,r,oc+5);
        if(!date && !typeRu && !catName && !amount) continue;
        var type = typeRu==="Доход" ? "income" : "expense";
        var catId = catIdByName(catName, type);
        var amt = sheetNum(amount);
        if(!catId || !amt) continue;
        out.transactions.push({ id:uid(), type:type, categoryId:catId, amount:amt,
          date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : todayStr(), note:(note||"").trim() });
      }
    }

    var budAnchor = findCellRC(rows, "Категория (расходы)");
    if(budAnchor){
      var bc = budAnchor.c;
      for (var r=budAnchor.r+1; r<rows.length; r++){
        var name = cellAt(rows,r,bc);
        if(!name) break;
        var limit = sheetNum(cellAt(rows,r,bc+2));
        var id = catIdByName(name, "expense");
        var cat = out.categories.expense.find(function(x){ return x.id===id; });
        if(cat && limit>0) cat.budget = limit;
      }
    }
    var incAnchor = findCellRC(rows, "Категория (доходы)");
    if(incAnchor){
      for (var r=incAnchor.r+1; r<rows.length; r++){
        var name = cellAt(rows,r,incAnchor.c);
        if(!name) break;
        catIdByName(name, "income");
      }
    }

    var invAnchor = findCellRC(rows, "ИНВЕСТИЦИИ");
    if(invAnchor){
      var ic = invAnchor.c, ir = invAnchor.r+1;
      for (var r=ir+1; r<rows.length; r++){
        var name = cellAt(rows,r,ic);
        if(!name) break;
        out.investments.push({ id:uid(), name:name.trim(), assetType:(cellAt(rows,r,ic+1)||"").trim(),
          invested:sheetNum(cellAt(rows,r,ic+2)), current:sheetNum(cellAt(rows,r,ic+3)) });
      }
    }
    var debtAnchor = findCellRC(rows, "ДОЛГИ И РАССРОЧКИ");
    if(debtAnchor){
      var dc = debtAnchor.c, dr = debtAnchor.r+1;
      for (var r=dr+1; r<rows.length; r++){
        var name = cellAt(rows,r,dc);
        if(!name) break;
        out.debts.push({ id:uid(), name:name.trim(), total:sheetNum(cellAt(rows,r,dc+1)),
          remaining:sheetNum(cellAt(rows,r,dc+2)), monthlyPayment:sheetNum(cellAt(rows,r,dc+3)) });
      }
    }
    var goalAnchor = findCellRC(rows, "ЦЕЛИ НАКОПЛЕНИЙ");
    if(goalAnchor){
      var gc = goalAnchor.c, gr = goalAnchor.r+1;
      for (var r=gr+1; r<rows.length; r++){
        var name = cellAt(rows,r,gc);
        if(!name) break;
        var deadline = (cellAt(rows,r,gc+3)||"").trim();
        out.goals.push({ id:uid(), name:name.trim(), current:sheetNum(cellAt(rows,r,gc+1)), target:sheetNum(cellAt(rows,r,gc+2)),
          deadline: /^\d{4}-\d{2}$/.test(deadline) ? deadline : "", note:(cellAt(rows,r,gc+4)||"").trim() });
      }
    }
    return out;
  }
  function handleSheetFileSelected(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var rows = parseCsvGrid(String(reader.result));
        var parsed = sheetRowsToState(rows);
        if(!parsed.transactions.length && !parsed.investments.length && !parsed.debts.length && !parsed.goals.length){
          showToast("В файле пока нет данных для импорта");
          return;
        }
        openImportConfirm(parsed, "файла");
      }catch(e){
        console.warn("sheet import failed", e);
        showToast("Не удалось прочитать файл — сохраните таблицу как CSV (UTF-8) и попробуйте снова");
      }
    };
    reader.onerror = function(){ showToast("Не удалось прочитать файл"); };
    reader.readAsText(file, "utf-8");
  }
  function handleBackupFileSelected(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed!=="object" || !parsed.categories || !parsed.transactions){ throw new Error("bad shape"); }
        parsed.categories.expense = parsed.categories.expense || [];
        parsed.categories.income = parsed.categories.income || [];
        parsed.transactions = parsed.transactions || [];
        parsed.investments = parsed.investments || [];
        parsed.debts = parsed.debts || [];
        parsed.goals = parsed.goals || [];
        parsed.selectedMonth = parsed.selectedMonth || state.selectedMonth || currentMonthStr();
        openImportConfirm(parsed);
      }catch(e){
        console.warn("backup import failed", e);
        showToast("Не удалось прочитать файл — это не резервная копия «Казначея»");
      }
    };
    reader.onerror = function(){ showToast("Не удалось прочитать файл"); };
    reader.readAsText(file, "utf-8");
  }

  /* ---------- delegated events ---------- */
  function armDelete(btn, onConfirm){
    if(btn.dataset.armed==="1"){ onConfirm(); return; }
    btn.dataset.armed = "1";
    btn.classList.add("btn-danger-arm");
    var prev = btn.innerHTML;
    btn.innerHTML = ICONS.trash;
    btn.setAttribute("title","Нажмите ещё раз для удаления");
    setTimeout(function(){ btn.dataset.armed=""; btn.classList.remove("btn-danger-arm"); btn.removeAttribute("title"); }, 2600);
  }

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.dataset.action;
    if(action==="nav"){ ui.tab = btn.dataset.tab; render(); return; }
    if(action==="month-prev"){ state.selectedMonth = shiftMonth(state.selectedMonth,-1); render(); return; }
    if(action==="month-next"){ state.selectedMonth = shiftMonth(state.selectedMonth,1); render(); return; }
    if(action==="add-tx"){ openTxModal(); return; }
    if(action==="edit-tx"){ openTxModal(btn.dataset.id); return; }
    if(action==="delete-tx"){ armDelete(btn, function(){ deleteTransaction(btn.dataset.id); }); return; }
    if(action==="add-category"){ openCategoryModal(btn.dataset.type||"expense"); return; }
    if(action==="delete-category"){ armDelete(btn, function(){ deleteCategory(btn.dataset.type, btn.dataset.id); }); return; }
    if(action==="add-inv"){ openInvModal(); return; }
    if(action==="edit-inv"){ openInvModal(btn.dataset.id); return; }
    if(action==="delete-inv"){ armDelete(btn, function(){ deleteInvestment(btn.dataset.id); }); return; }
    if(action==="add-debt"){ openDebtModal(); return; }
    if(action==="edit-debt"){ openDebtModal(btn.dataset.id); return; }
    if(action==="delete-debt"){ armDelete(btn, function(){ deleteDebt(btn.dataset.id); }); return; }
    if(action==="add-goal"){ openGoalModal(); return; }
    if(action==="edit-goal"){ openGoalModal(btn.dataset.id); return; }
    if(action==="delete-goal"){ armDelete(btn, function(){ deleteGoal(btn.dataset.id); }); return; }
    if(action==="add-goal-preset"){ openGoalModal(null, {name:"Подушка безопасности"}); return; }
    if(action==="export-csv"){ exportCsv(); return; }
    if(action==="export-backup"){ exportBackup(); return; }
    if(action==="import-backup"){ var fi=document.getElementById("backup-file-input"); if(fi) fi.click(); return; }
    if(action==="import-sheet"){ var sfi=document.getElementById("sheet-file-input"); if(sfi) sfi.click(); return; }
    if(action==="sync-info"){ openSyncInfoModal(); return; }
    if(action==="save-firebase-config"){
      var ta = document.getElementById("firebase-config-input");
      var raw = ta ? ta.value.trim() : "";
      if(!raw){ showToast("Вставьте конфигурацию Firebase"); return; }
      var cfg;
      try{ cfg = JSON.parse(raw); }catch(e){ showToast("Это не похоже на JSON — скопируйте конфигурацию целиком"); return; }
      if(!cfg || !cfg.apiKey || !cfg.projectId){ showToast("В конфигурации не хватает apiKey или projectId"); return; }
      try{ localStorage.setItem(FIREBASE_LS_KEY, JSON.stringify(cfg)); }catch(e){ showToast("Не удалось сохранить настройки в этом браузере"); return; }
      showToast("Сохранено, подключаюсь…");
      setTimeout(function(){ location.reload(); }, 500);
      return;
    }
    if(action==="clear-firebase-config"){
      try{ localStorage.removeItem(FIREBASE_LS_KEY); }catch(e){}
      showToast("Синхронизация отключена — данные остаются в этом браузере");
      setTimeout(function(){ location.reload(); }, 500);
      return;
    }
    if(action==="close-modal"){ closeModal(); return; }
    if(action==="modal-backdrop"){ if(e.target===btn) closeModal(); return; }
  });

  document.addEventListener("click", function(e){
    var typeBtn = e.target.closest("[data-role='type-toggle'] button");
    if(!typeBtn) return;
    var wrap = typeBtn.closest("[data-role='type-toggle']");
    wrap.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b===typeBtn); });
    var input = wrap.parentElement.querySelector("[data-role='type-input']");
    input.value = typeBtn.dataset.type;
    var select = wrap.closest("form").querySelector("[data-role='category-select']");
    if(select) select.innerHTML = categorySelectOptions(typeBtn.dataset.type, null);
  });

  document.addEventListener("submit", function(e){
    var form = e.target;
    if(!form.dataset.form) return;
    e.preventDefault();
    if(form.dataset.form==="transaction") saveTransaction(form);
    else if(form.dataset.form==="category") saveCategory(form);
    else if(form.dataset.form==="investment") saveInvestment(form);
    else if(form.dataset.form==="debt") saveDebt(form);
    else if(form.dataset.form==="goal") saveGoal(form);
  });

  document.addEventListener("change", function(e){
    var el = e.target;
    if(el.id==="backup-file-input"){ handleBackupFileSelected(el.files && el.files[0]); el.value=""; return; }
    if(el.id==="sheet-file-input"){ handleSheetFileSelected(el.files && el.files[0]); el.value=""; return; }
    if(el.dataset && el.dataset.role==="budget-input"){ setBudget(el.dataset.id, el.value); return; }
    if(el.dataset && el.dataset.role==="filter-scope"){ ui.txScope = el.value; render(); return; }
    if(el.dataset && el.dataset.role==="filter-type"){ ui.txType = el.value; render(); return; }
    if(el.dataset && el.dataset.role==="filter-category"){ ui.txCategory = el.value; render(); return; }
  });
  document.addEventListener("input", function(e){
    var el = e.target;
    if(el.dataset && el.dataset.role==="filter-search"){ ui.txSearch = el.value; render(); var f=document.querySelector("[data-role='filter-search']"); if(f){ f.focus(); f.selectionStart=f.selectionEnd=f.value.length; } }
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });

  /* ---------- boot ---------- */
  function boot(){
    render();
    loadState().then(render);
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
})();
</script>
</body>
</html>
</script>
